<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOBHA · Inventory Movement &amp; Availability</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- session check: sends to login page if not logged in or 30 min is over -->
<script src="auth.js"></script>
<script>requireLogin();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== same tokens as the dashboard ===== */
:root {
  --bg:#F4EFE6; --surface:#FBF7EE; --surface-2:#EFE8DA;
  --ink:#0B1E2F; --ink-soft:#5A6B7C;
  --line:#DDD4C1; --line-strong:#C9BFA6;
  --accent:#B7945A; --accent-2:#8E6C34;
  --serif: 'Cormorant Garamond', 'Times New Roman', serif;
  --sans: 'Manrope', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --max:1600px; --topbar-h:76px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; }
body { min-height:100vh; padding-top:var(--topbar-h);
  background-image:radial-gradient(circle at 20% 0%, rgba(183,148,90,0.05) 0%, transparent 40%), radial-gradient(circle at 90% 100%, rgba(11,30,47,0.04) 0%, transparent 40%);
  background-attachment:fixed; }
h1, h2, h3 { font-family:var(--serif); font-weight:300; letter-spacing:-0.015em; }
em { color:var(--accent); font-style:italic; font-weight:400; }
a { color:inherit; text-decoration:none; }

/* ===== top bar ===== */
.topbar { position:fixed; top:0; left:0; right:0; height:var(--topbar-h); display:flex; align-items:center; justify-content:space-between; padding:0 30px; background:var(--surface); border-bottom:1px solid var(--line); z-index:500; }
.brand { display:flex; align-items:center; gap:14px; height:100%; }
.brand-logo { height:26px; width:auto; display:block; mix-blend-mode:multiply; }
.brand-divider { width:1px; height:16px; background:var(--line-strong); }
.brand-crumb { display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:10.5px; letter-spacing:0.04em; }
.cc-tag { color:var(--ink-soft); letter-spacing:0.18em; text-transform:uppercase; font-size:9px; }
.cc-sep { color:var(--line-strong); }
.cc-main { color:var(--ink); font-family:var(--serif); font-style:italic; font-size:13px; }
.cc-page { color:var(--accent-2); font-family:var(--serif); font-style:italic; font-size:13px; }
.maintabs { display:flex; gap:6px; }
.maintabs a { padding:11px 22px; font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); border-radius:999px; cursor:pointer; transition:.15s; user-select:none; }
.maintabs a:hover { color:var(--ink); background:rgba(11,30,47,0.06); }
.maintabs a.active { color:#fff; background:var(--ink); }  

/* ===== page head ===== */
.page-head { max-width:var(--max); margin:0 auto; padding:64px 30px 40px; }
.page-head .crumb { font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent); display:inline-flex; align-items:center; gap:14px; margin-bottom:14px; }
.page-head .crumb::before { content:''; width:32px; height:1px; background:var(--accent); opacity:.6; }
.page-head h1 { font-size:clamp(40px,4.1vw,66px); font-weight:300; letter-spacing:-0.02em; line-height:1.05; color:var(--ink); }
.page-head .blurb { font-family:var(--serif); font-size:19px; font-weight:300; color:var(--ink-soft); margin-top:22px; max-width:760px; line-height:1.55; }

/* ===== section rows ===== */
.home-list { max-width:var(--max); margin:0 auto; padding:0 30px; }
.home-row { display:grid; grid-template-columns:90px 1fr auto 70px; align-items:center; column-gap:24px; padding:46px 0 44px; border-bottom:1px solid var(--line); color:inherit; cursor:pointer; position:relative; transition:background .25s; }
.home-row:first-child { border-top:1px solid var(--line); }
.home-row::before { content:''; position:absolute; inset:0 -24px; background:linear-gradient(90deg, transparent, rgba(183,148,90,0.07), transparent); opacity:0; transition:opacity .25s; pointer-events:none; }
.home-row:hover::before, .home-row:focus-visible::before { opacity:1; }
.home-row:focus-visible { outline:1px solid var(--accent); outline-offset:6px; }
.hr-no { font-family:var(--serif); font-size:30px; font-weight:400; color:var(--accent); letter-spacing:0.02em; }
.hr-eyebrow { font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:0.28em; text-transform:uppercase; color:var(--ink-soft); display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.hr-eyebrow::before { content:''; width:24px; height:1px; background:var(--ink-soft); opacity:.6; }
.hr-title { font-family:var(--serif); font-size:clamp(30px,2.7vw,42px); font-weight:400; letter-spacing:-0.01em; line-height:1.1; color:var(--ink); }
.hr-title em { color:var(--accent); font-style:italic; font-weight:400; }
.hr-stats { display:flex; gap:48px; }
.hr-stat { min-width:150px; }
.hr-k { font-family:var(--mono); font-size:9.5px; font-weight:500; letter-spacing:0.24em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:14px; white-space:nowrap; }
.hr-v { font-family:var(--serif); font-size:30px; font-weight:400; color:var(--ink); line-height:1; white-space:nowrap; }
.hr-arrow { color:var(--ink-soft); justify-self:end; transition:transform .25s, color .25s; }
.home-row:hover .hr-arrow, .home-row:focus-visible .hr-arrow { transform:translateX(8px); color:var(--accent); }


@media (max-width:900px){ .home-row { grid-template-columns:1fr; row-gap:18px; } .hr-stats { gap:28px; } .hr-arrow { justify-self:start; } }
@media (max-width:1100px){ .topbar { padding:0 16px; } .brand-crumb { display:none; } .page-head, .home-list { padding-left:16px; padding-right:16px; } .upload-nav-pill { bottom: 12px; left: 12px; } }

/* ===== footer ===== */
.foot { max-width:1600px; margin:28px auto 0; padding:26px 30px; display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--ink-soft); letter-spacing:0.2em; text-transform:uppercase; font-weight:500; }
.foot .b { color:var(--accent); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="sobha-logo.png" alt="SOBHA">
    <span class="brand-divider"></span>
    <div class="brand-crumb">
      <span class="cc-tag">India</span><span class="cc-sep">|</span>
      <span class="cc-main">Sobha Dashboard</span><span class="cc-sep">·</span>
      <span class="cc-page">Home</span>
    </div>
  </div>
  <nav class="maintabs">
    <a class = "logout" href="#" onclick="logout(); return false;">Logout</a>
  </nav>
</header>

<main>
  <div class="page-head">
    <div class="crumb" id="hm-eyebrow">Portfolio</div>
    <h1>SOBHA<em></em></h1>
  </div>

  <div class="home-list">
    <a class="home-row" href="first.html">
      <div class="hr-no">01</div>
      <div class="hr-main">
        <div class="hr-title"><em>Sales
        </em></div>
      </div>
      <div class="hr-arrow"><svg viewBox="0 0 30 10" width="30" height="10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 5h28M24 1l4 4-4 4"/></svg></div>
    </a>

    <a class="home-row">
      <div class="hr-no">02</div>
      <div class="hr-main">
        <div class="hr-title"><em> Marketing</em></div>
      </div>
      <div class="hr-arrow"><svg viewBox="0 0 30 10" width="30" height="10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 5h28M24 1l4 4-4 4"/></svg></div>
    </a>

    <a class="home-row">
      <div class="hr-no">03</div>
      <div class="hr-main">
        <div class="hr-title"><em>Projects</em></div>
      </div>
      <div class="hr-arrow"><svg viewBox="0 0 30 10" width="30" height="10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 5h28M24 1l4 4-4 4"/></svg></div>
    </a>


  <div class="foot">
    <span class="b">SOBHA</span>
    <span id="hm-foot"></span>
  </div>
</main>
<script>
  // Get local date in YYYY-MM-DD format
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const day = String(today.getDate()).padStart(2, '0');

  const formattedDate = `${year}-${month}-${day}`;
  document.getElementById('currentDate').value = formattedDate;
</script>
</body>
</html>
